<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open the TLS connection to the media origin (generated images/video live
         on the Omnia MinIO host) before the JS bundle even asks for them, so the
         hero image/video start downloading ~1 RTT sooner. -->
    <link rel="preconnect" href="https://constructor.lead-generator.ru" crossorigin />
    <link rel="dns-prefetch" href="https://constructor.lead-generator.ru" />
    <title>Omnia.AI Project</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Workspace-only editor bridge. The inspector is served by the control
         plane so this SPA uses the same canonical implementation as static and
         Next.js previews. document.referrer works for local, staging and custom
         workspace origins; top-level public visitors never load the editor. -->
    <script>
      (function () {
        if (window.self === window.top) return;
        try {
          var params = new URLSearchParams(location.hash.slice(1));
          var origin =
            params.get("omniaApi") ||
            (document.referrer ? new URL(document.referrer).origin : "");
          if (!origin) return;
          origin = origin.replace(/\/+$/, "");
          var script = document.createElement("script");
          script.src = origin + "/api/kit/omnia-inspector.js";
          script.async = true;
          script.setAttribute("data-omnia-inspector-loader", "1");
          document.body.appendChild(script);
        } catch (_) {}
      })();
    </script>
  </body>
</html>
