<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Omnia MAX — клиентский путь от идеи до запуска</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191b20'/%3E%3Ctext x='16' y='21' font-size='18' text-anchor='middle' fill='%23f15a38'%3E%C2%A7%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --page: #f4f1ea;
      --paper: #fffdf8;
      --surface: #f8f5ef;
      --ink: #171716;
      --muted: #77736b;
      --line: #d8d3c9;
      --line-strong: #aaa399;
      --coral: #f15a38;
      --coral-dark: #d94727;
      --coral-soft: #fff0ea;
      --green: #23884a;
      --green-soft: #e9f6ed;
      --navy: #18314f;
      --gold: #b98420;
      --gold-soft: #fff5dc;
      --danger: #c53d35;
      --shadow: 0 18px 50px rgba(34, 29, 22, .10);
      --radius: 22px;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--page); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 0%, rgba(241, 90, 56, .07), transparent 32rem),
        var(--page);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(241, 90, 56, .28);
      outline-offset: 2px;
    }
    h1, h2, h3 { text-wrap: balance; }
    p, li, small { text-wrap: pretty; }
    .plan-price, .order-total, .billing-facts strong, .account-detail-row strong, .dock-copy span { font-variant-numeric: tabular-nums; }
    button:active:not(:disabled) { transform: scale(.98); }
    button[disabled] { opacity: .42; cursor: not-allowed; }

    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      min-height: 74px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .94);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand, .brand-mark, .top-context, .top-actions, .inline, .status-line {
      display: flex;
      align-items: center;
    }
    .brand { gap: 12px; min-width: 190px; }
    .brand-mark {
      width: 44px;
      height: 44px;
      justify-content: center;
      border-radius: 13px;
      color: #fff;
      background: var(--ink);
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(23, 23, 22, .16);
    }
    .brand strong { font-size: 20px; letter-spacing: -.03em; }
    .brand small, .top-context small { display: block; color: var(--muted); font-size: 12px; }
    .top-context { gap: 14px; min-width: 0; flex: 1; justify-content: center; }
    .top-step {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--coral);
      font-weight: 800;
      font-size: 13px;
      flex: none;
    }
    .top-context strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { gap: 8px; }
    .btn {
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      cursor: pointer;
      font-weight: 750;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    }
    .btn:hover:not([disabled]) { transform: translateY(-1px); border-color: var(--line-strong); }
    .btn.primary {
      color: #fff;
      border-color: var(--coral);
      background: var(--coral);
      box-shadow: 0 10px 24px rgba(241, 90, 56, .2);
    }
    .btn.primary:hover:not([disabled]) { background: var(--coral-dark); border-color: var(--coral-dark); }
    .btn.dark { color: #fff; background: var(--ink); border-color: var(--ink); }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--danger); border-color: #e4b3ae; background: #fff8f7; }
    .btn.block { width: 100%; }
    .icon-btn {
      width: 46px;
      height: 46px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      cursor: pointer;
      font-size: 18px;
    }

    .workspace {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr) 300px;
      gap: 18px;
      align-items: start;
    }
    .journey-rail, .insight-panel, .stage {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .92);
      box-shadow: var(--shadow);
    }
    .journey-rail, .insight-panel {
      position: sticky;
      top: 96px;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .rail-head, .insight-head {
      padding: 19px 20px 16px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .rail-head h2, .insight-head h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .rail-head p, .insight-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .phase-list { padding: 10px; display: grid; gap: 5px; }
    .phase-button {
      width: 100%;
      min-height: 58px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 9px;
      text-align: left;
      cursor: pointer;
    }
    .phase-button:hover { background: var(--surface); }
    .phase-button.active { border-color: #f6baa9; background: var(--coral-soft); }
    .phase-button.complete .phase-index { color: #fff; background: var(--green); border-color: var(--green); }
    .phase-index {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 850;
      background: var(--paper);
    }
    .phase-copy strong { display: block; font-size: 13px; }
    .phase-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .phase-count { color: var(--muted); font-size: 11px; }
    .rail-result {
      margin: 4px 12px 14px;
      padding: 14px;
      border-radius: 15px;
      background: var(--ink);
      color: #fff;
    }
    .rail-result span { display: block; color: #c8c5bd; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    .rail-result strong { display: block; margin-top: 6px; font-size: 14px; line-height: 1.4; }

    .stage {
      min-height: calc(100vh - 174px);
      border-radius: 28px;
      overflow: hidden;
    }
    .stage-head {
      min-height: 84px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .stage-head h1 { margin: 3px 0 0; font-size: clamp(20px, 2vw, 28px); letter-spacing: -.035em; }
    .stage-progress { min-width: 180px; text-align: right; }
    .stage-progress small { color: var(--muted); font-size: 12px; }
    .progress-track {
      height: 7px;
      margin-top: 8px;
      border-radius: 99px;
      overflow: hidden;
      background: #e7e2d8;
    }
    .progress-track span { display: block; height: 100%; border-radius: inherit; background: var(--coral); transition: width .3s ease; }
    .screen { min-height: 650px; animation: reveal .28s ease both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(7px); } }
    .screen-pad { padding: clamp(22px, 4vw, 48px); }
    .screen-narrow { width: min(660px, 100%); margin: 0 auto; }
    .screen-wide { width: min(980px, 100%); margin: 0 auto; }
    .screen-center { min-height: 650px; display: grid; place-items: center; padding: 34px; }
    .screen-title { margin: 0; font-size: clamp(30px, 4vw, 52px); line-height: 1.02; letter-spacing: -.055em; }
    .screen-subtitle { margin: 16px 0 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
    .kicker { margin: 0 0 10px; color: var(--coral); font-size: 12px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; }
    .divider { height: 1px; background: var(--line); margin: 20px 0; }
    .inline { gap: 10px; flex-wrap: wrap; }
    .status-line { gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    .pill.green { color: var(--green); background: var(--green-soft); }
    .pill.coral { color: var(--coral-dark); background: var(--coral-soft); }
    .pill.gold { color: #7b5919; background: var(--gold-soft); }

    .welcome-grid {
      min-height: 650px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 30px;
      padding: clamp(28px, 5vw, 58px);
      background:
        linear-gradient(120deg, transparent 55%, rgba(241, 90, 56, .045)),
        var(--paper);
    }
    .welcome-copy ul { margin: 26px 0; padding: 0; display: grid; gap: 11px; list-style: none; }
    .welcome-copy li { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 650; }
    .check {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--green);
      background: var(--green-soft);
      flex: none;
    }
    .value-note {
      margin-top: 18px;
      padding: 14px 16px;
      border-left: 3px solid var(--coral);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .phone-wrap { position: relative; width: min(350px, 100%); margin: 0 auto; }
    .phone {
      position: relative;
      width: 100%;
      aspect-ratio: 390 / 790;
      padding: 12px;
      border-radius: 48px;
      background: #101010;
      box-shadow: 0 28px 55px rgba(20, 18, 15, .24);
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      width: 92px;
      height: 25px;
      transform: translateX(-50%);
      border-radius: 18px;
      background: #000;
      z-index: 2;
    }
    .phone-screen {
      height: 100%;
      overflow: hidden;
      border-radius: 37px;
      background: #fbfaf6;
      display: grid;
      grid-template-rows: 45px 1fr 66px;
    }
    .phone-status {
      padding: 12px 18px 0;
      display: flex;
      justify-content: space-between;
      color: #fff;
      background: #101010;
      font-size: 12px;
      font-weight: 850;
    }
    .mini-content { padding: 20px 17px; overflow: hidden; }
    .mini-brand { display: flex; align-items: center; justify-content: space-between; }
    .mini-brand span:first-child { font-size: 19px; font-weight: 900; letter-spacing: -.04em; }
    .mini-avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; }
    .mini-hero { margin-top: 18px; padding: 20px; border-radius: 24px; color: #fff; background: linear-gradient(145deg, #203d61, #11283f); }
    .mini-hero small { color: #d8e3ee; }
    .mini-hero h3 { margin: 8px 0; font-size: 27px; letter-spacing: -.05em; }
    .mini-hero .mini-cta { margin-top: 12px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: #f4cf78; color: var(--ink); display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; }
    .mini-section-title { margin: 18px 0 10px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 850; }
    .mini-order { padding: 12px; border: 1px solid #ded9cf; border-radius: 15px; display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 10px; }
    .mini-cup { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #fff0d2; font-size: 20px; }
    .mini-order strong { display: block; font-size: 12px; }
    .mini-order small { color: var(--muted); font-size: 10px; }
    .mini-price { font-size: 12px; font-weight: 800; }
    .mini-nav { padding: 9px 12px; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--navy); color: #c9d6e4; }
    .mini-nav span { display: grid; place-items: center; gap: 2px; font-size: 9px; }
    .mini-nav b { color: #fff; font-size: 17px; }
    .phone-tag {
      position: absolute;
      right: -18px;
      top: 88px;
      padding: 11px 14px;
      border: 1px solid #f3c2b5;
      border-radius: 14px;
      background: var(--paper);
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 800;
    }

    .form-card {
      padding: clamp(22px, 4vw, 38px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--paper);
    }
    .form-card h2 { margin: 0; font-size: 30px; letter-spacing: -.04em; }
    .form-card > p { margin: 9px 0 24px; color: var(--muted); line-height: 1.5; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label, fieldset legend { font-size: 13px; font-weight: 800; }
    .field input, .field textarea, .field select {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: #fff;
    }
    .field textarea { min-height: 104px; resize: vertical; line-height: 1.45; }
    .field small { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .check-row {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: start;
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .check-row input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--coral); }
    .form-actions { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .form-actions p { margin: 0; color: var(--muted); font-size: 12px; }
    .error-copy { margin-top: 8px; color: var(--danger); font-size: 12px; font-weight: 700; }

    .mail-card { text-align: center; }
    .mail-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: var(--coral);
      background: var(--coral-soft);
      font-size: 30px;
    }
    .code-inputs { margin: 22px auto; display: flex; justify-content: center; gap: 9px; }
    .code-inputs input { width: 54px; height: 60px; border: 1px solid var(--line); border-radius: 14px; text-align: center; font-size: 24px; font-weight: 850; }

    .pricing-intro { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 24px; }
    .pricing-intro h2 { margin: 0; font-size: clamp(30px, 4vw, 46px); letter-spacing: -.05em; }
    .pricing-intro p { max-width: 520px; margin: 10px 0 0; color: var(--muted); line-height: 1.5; }
    .billing-chip { flex: none; padding: 9px 12px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 800; }
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    .plan-card {
      position: relative;
      min-height: 395px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .plan-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .plan-card.selected { border: 2px solid var(--coral); padding: 21px; box-shadow: 0 15px 32px rgba(241, 90, 56, .12); }
    .plan-card.recommended::before {
      content: "Чаще выбирают";
      position: absolute;
      top: -12px;
      left: 18px;
      padding: 5px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--coral);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .04em;
    }
    .plan-card h3 { margin: 7px 0 4px; font-size: 25px; letter-spacing: -.04em; }
    .plan-price { margin: 14px 0; font-size: 30px; font-weight: 900; letter-spacing: -.045em; }
    .plan-price small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .plan-card > p { min-height: 42px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .plan-card ul { margin: 20px 0; padding: 0; display: grid; gap: 10px; list-style: none; font-size: 12px; }
    .plan-card li { display: grid; grid-template-columns: 20px 1fr; gap: 7px; }
    .plan-card .btn { margin-top: auto; width: 100%; }
    .plans-note { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 12px; }

    .checkout-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 18px; align-items: start; }
    .order-box {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }
    .order-box h3 { margin: 0 0 18px; font-size: 18px; }
    .order-line { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .order-line:last-of-type { border-bottom: 0; }
    .order-total { margin-top: 14px; display: flex; justify-content: space-between; font-size: 20px; font-weight: 900; }
    .payment-tabs { margin: 4px 0 18px; padding: 4px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 13px; background: var(--surface); }
    .payment-tabs button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-weight: 750; }
    .payment-tabs button.active { background: #fff; box-shadow: 0 3px 12px rgba(30, 25, 20, .08); }
    .card-number { position: relative; }
    .card-number::after { content: "МИР"; position: absolute; right: 13px; bottom: 15px; color: var(--green); font-size: 12px; font-weight: 900; }
    .safe-payment { margin-top: 16px; padding: 12px 14px; border-radius: 13px; background: var(--green-soft); color: #27623c; font-size: 12px; line-height: 1.45; }
    .billing-facts { margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .billing-facts div { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .billing-facts span { display: block; color: var(--muted); font-size: 11px; }
    .billing-facts strong { display: block; margin-top: 5px; font-size: 13px; }
    .free-activate { text-align: center; padding: 38px; }
    .free-zero { width: 94px; height: 94px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 28px; background: var(--green-soft); color: var(--green); font-size: 34px; font-weight: 900; }

    /* Реалистичный клиентский путь оплаты: Omnia → ЮKassa → банк → Omnia. */
    .payment-method-grid,
    .provider-method-grid { margin: 18px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .payment-method-card { min-height: 92px; padding: 15px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: #fff; cursor: pointer; text-align: left; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .payment-method-card:hover { transform: translateY(-1px); border-color: var(--line-strong); }
    .payment-method-card.active { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(241,90,56,.1); background: #fff8f5; }
    .payment-method-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .payment-method-top strong { font-size: 14px; }
    .payment-method-top em { padding: 4px 7px; border-radius: 999px; color: var(--muted); background: var(--surface); font-size: 9px; font-style: normal; font-weight: 800; }
    .payment-method-card small { display: block; margin-top: 9px; color: var(--muted); line-height: 1.4; }
    .provider-route { min-height: 100vh; padding: 34px 18px 112px; background: #f1f3f6; }
    .yookassa-shell { width: min(1040px, 100%); margin: 0 auto; }
    .yookassa-window { overflow: hidden; border: 1px solid #dfe3e8; border-radius: 22px; background: #fff; box-shadow: 0 24px 70px rgba(23,31,44,.12); }
    .yookassa-top { min-height: 76px; padding: 16px 24px; border-bottom: 1px solid #e7e9ec; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .yookassa-top > div { display: grid; gap: 5px; }
    .yookassa-top small { color: #6f7782; }

      .product-shell, .product-shell.no-preview { grid-template-columns: 78px minmax(0, 1fr); }

      .product-sidebar-head .brand > div, .sidebar-label, .project-chip > div, .sidebar-item span:not(.side-icon), .launch-path, .sidebar-account > div { display: none; }

    @media (max-width: 640px) {

      .product-sidebar { display: none; }
      .product-header { height: 74px; padding: 0 14px; }

      .product-header-actions .secondary-action, .product-header-actions .cost-action { display: none; }
      .product-content { min-height: calc(100vh - 146px); }
      .product-content .screen,
      .product-content .screen-center,
      .product-content .welcome-grid,
      .product-content .preview-layout { min-height: calc(100vh - 146px); }
      .public-site-header { height: 68px; padding: 0 14px; }

      .cjm-dock { grid-template-columns: 44px 44px minmax(0, 1fr) 44px 44px; min-height: 54px; }
      .dock-copy span { display: none; }
      .map-overlay { padding: 8px; }
      .home-proof-grid,
      .home-route-grid,
      .plans-next-grid,
      .map-phase-grid,

      .launch-followup { grid-template-columns: 1fr; }
    }

    /* Production mirror: размеры, оболочки и визуальная иерархия работающего Omnia. */

    /* Регистрация / подтверждение: точная auth-оболочка MAX Studio. */
    .auth-route { min-height: 100vh; padding: 32px 20px 100px; background: #f5f3ee; }
    .auth-header { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .auth-product { display: flex; align-items: center; gap: 12px; }
    .auth-divider { width: 1px; height: 20px; background: var(--line); }
    .auth-product > span:last-child,
    .auth-login { color: var(--muted); font-size: 14px; }
    .auth-login { border: 0; color: #c84528; background: transparent; cursor: pointer; }
    .auth-layout {
      max-width: 1120px;
      margin: 0 auto;
      padding: 92px 0;

      grid-template-columns: .85fr 1.15fr;
      align-items: center;
      gap: 48px;
    }

    .auth-trust span { color: var(--coral); margin-right: 5px; }

    /* PublicPageShell + billing: настоящая публичная и платёжная оболочка. */

    .billing-shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }

    .product-shell {
      height: calc(100vh - 78px);

    .product-title strong { font-size: 14px; }
    .product-title span { margin-top: 3px; font-size: 9px; }

    .public-route,
    .product-shell,
    .account-route-real,
    .map-dialog,
    .legal-panel,
    .cjm-dock {
      --page: #0f1115;
      --paper: #191b20;
      --surface: #20232a;
      --ink: #f5f7fb;
      --muted: #979da8;

            state.paymentStatus = "succeeded";
            state.paid = true;
            state.methodSaved = state.renewal;
            state.cancelled = false;
          } else {
            state.paymentStatus = "pending";
          }
          saveState();
          return render();
        }
        if (action === "payment-success") {
          state.paymentStatus = "succeeded";
          state.paid = true;
          state.methodSaved = state.renewal;
          state.cancelled = false;
          saveState();
          return go(9);
        }
        if (action === "payment-retry") {
          state.paymentAttempts += 1;
          state.paymentStatus = "pending";
          state.paid = false;
          state.paymentChecks = 0;
          state.providerStage = "method";
          saveState();
          return go(7);
        }
        if (action === "payment-change-method") {
          state.paymentAttempts += 1;
          state.paymentStatus = "pending";
          state.paymentChecks = 0;
          state.providerStage = "method";
          state.paid = false;
          saveState();
          return go(7);
        }
        if (action === "brief-type") { state.brief.type = trigger.getAttribute("data-value"); saveState(); return render(); }
        if (action === "toggle-feature") {
          var value = trigger.getAttribute("data-value");
          var position = state.brief.features.indexOf(value);
          if (position >= 0) state.brief.features.splice(position, 1); else state.brief.features.push(value);
          saveState();
          return render();
        }
        if (action === "confirm-brief") {
          if (!validBrief()) return setToast("Опишите идею хотя бы одним понятным предложением.");
          return go(4);
        }
        if (action === "start-generation") {
          if (!state.accountCreated) return go(1);
          state.generation = 4;
          state.generated = false;
          saveState();
          go(10);
          return startGeneration();
        }
        if (action === "finish-generation") {
          window.clearInterval(generationTimer);
          state.generation = 100;
          state.generated = true;
          saveState();
          return render();
        }
        if (action === "preview-ok") return go(5);
        if (action === "upgrade-launch") return go(5);
        if (action === "open-customer-path") {
          if (!state.plan || state.plan === "free") return go(5);
          state.journeyPersona = "customer";
          state.clientPaymentStatus = "idle";
          saveState();
          return go(17);
        }
        if (action === "open-owner-path") return go(isLaunchLive() ? 14 : 11);
        if (action === "client-open") return go(18);
        if (action === "client-auth") return go(19);
        if (action === "client-order") return go(20);
        if (action === "client-pay") {
          state.clientPaymentStatus = "processing";
          saveState();
          return go(21);
        }
        if (action === "client-payment-check") {
          state.clientPaymentStatus = "succeeded";
          saveState();
          return render();
        }
        if (action === "client-payment-retry") {
          state.clientPaymentStatus = "processing";
          saveState();
          return render();
        }
        if (action === "client-receipt") return setToast("Электронный чек открыт внутри приложения.");
        if (action === "edit-mode") { state.editMode = trigger.getAttribute("data-mode"); saveState(); return render(); }
        if (action === "apply-edit") {
          state.version += 1;
          saveState();
          return setToast("Правка сохранена как версия v" + state.version + ".");
        }
        if (action === "version-compare") return setToast("Сравнение v" + trigger.getAttribute("data-version") + " с текущей версией открыто в превью.");
        if (action === "version-restore") {
          var restoredVersion = trigger.getAttribute("data-version");
          state.version += 1;
          saveState();
          return setToast("v" + restoredVersion + " восстановлена как новая текущая версия v" + state.version + ". История сохранена.");
        }
        if (action === "save-app-data") {
          if (!state.operatorName.trim()) return setToast("Укажите оператора приложения.");
          if (!/.+@.+\..+/.test(state.supportEmail)) return setToast("Проверьте email поддержки.");
          if (!/^https:\/\//i.test(state.privacyUrl)) return setToast("Добавьте HTTPS-ссылку на политику данных.");
          if (!state.privacy) return setToast("Подтвердите актуальность сведений.");
          state.appDataReady = true;
          saveState();
          return moveJourney(1);
        }
        if (action === "connect-max-access") {
          if (state.botSecret.trim().length < 8) return setToast("Вставьте токен промодерированного бота из MAX Partner.");
          state.botSecret = "";
          state.maxAccessConnected = true;
          saveState();
          return render();
        }
        if (action === "skip-max-partner") return go(13);
        if (action === "skip-max-access") return moveJourney(1);
        if (action === "publish") {
          if (!state.appDataReady) { state.toast = "Сначала заполните данные и политики приложения."; return go(24); }
          if (state.plan && state.plan !== "free" && !state.maxAccessConnected) { state.toast = "Сначала подключите безопасный вход MAX."; return go(25); }
          if (!state.publishSlug.trim()) return setToast("Проверьте адрес приложения.");
          state.deployStatus = "building";
          saveState();
          return render();
        }
        if (action === "finish-publish") {
          state.deployStatus = "succeeded";
          state.published = true;
          saveState();
          if (!state.plan || state.plan === "free") return go(14);
          return go(27);
        }
        if (action === "moderation-check") {
          state.moderationStatus = "approved";
          saveState();
          return render();
        }
        if (action === "moderation-continue") return go(25);
        if (action === "max-url-check") {
          state.maxUrlConnected = true;
          saveState();
          return render();
        }
        if (action === "max-url-finish") return go(14);
        if (action === "copy-link") {
          var url = publishedUrl();
          if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
          return setToast("Ссылка скопирована.");
        }
        if (action === "open-result") return setToast("В реальном продукте здесь откроется опубликованное приложение.");
        if (action === "cancel-renewal") {
          if (!window.confirm("Отключить автопродление? Тариф продолжит работать до конца оплаченного периода.")) return;
          state.cancelled = true;
          state.renewal = false;
          saveState();
          return render();
        }
        if (action === "resume-renewal") {
          if (!state.methodSaved) return setToast("Сначала нужен сохранённый способ оплаты в ЮKassa.");
          state.cancelled = false;
          state.renewal = true;
          saveState();
          return render();
        }
        if (action === "renewal-setup") return setToast("В реальном продукте здесь откроется отдельное подтверждение ЮKassa для включения автопродления.");
        if (action === "toggle-renewal") {
          if (!state.renewal && !state.methodSaved) return setToast("Сначала добавьте способ оплаты через ЮKassa.");
          if (state.renewal) {
            state.cancelled = true;
            state.renewal = false;
          } else {
            state.cancelled = false;
            state.renewal = true;
          }
          saveState();
          return render();
        }
        if (action === "documents") return setToast("Откроется список чеков, условий и истории платежей.");
      });

      render();
      if (state.step === 10 && !state.generated) startGeneration();
    })();
  </script>
</body>
</html>
