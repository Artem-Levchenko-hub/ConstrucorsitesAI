name: Production generation canary

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-generation-canary
  cancel-in-progress: false

jobs:
  authorize-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Reject production canary outside main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Production generation canary runs only from refs/heads/main"
          exit 1

  canary:
    needs: authorize-ref
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_GENERATION_CANARY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Verify protected canary configuration
        shell: bash
        env:
          PRODUCTION_CANARY_EMAIL: ${{ secrets.PRODUCTION_CANARY_EMAIL }}
          PRODUCTION_CANARY_PASSWORD: ${{ secrets.PRODUCTION_CANARY_PASSWORD }}
          PRODUCTION_EXPECTED_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_RELEASE_SHA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          for name in \
            PRODUCTION_CANARY_EMAIL \
            PRODUCTION_CANARY_PASSWORD \
            PRODUCTION_EXPECTED_RELEASE_SHA \
            TELEGRAM_BOT_TOKEN \
            TELEGRAM_CHAT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured"
              exit 1
            fi
          done

      - name: Install the locked API environment
        working-directory: apps/api
        run: uv sync --frozen

      - name: Run disposable build, preview, and edit canary
        working-directory: apps/api
        env:
          PRODUCTION_CANARY_EMAIL: ${{ secrets.PRODUCTION_CANARY_EMAIL }}
          PRODUCTION_CANARY_PASSWORD: ${{ secrets.PRODUCTION_CANARY_PASSWORD }}
          PRODUCTION_EXPECTED_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_RELEASE_SHA }}
          PRODUCTION_CANARY_RESULT_FILE: ${{ runner.temp }}/production-canary-result.json
        run: uv run python scripts/production_generation_canary.py

      - name: Open one generation-canary incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] Omnia production generation canary failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (!issues.some((issue) => issue.title === title && !issue.pull_request)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "The disposable production build/edit canary failed.",
                  "",
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  "",
                  "No request payloads, cookies, signed preview URLs, or response bodies are included in this issue.",
                ].join("\n"),
              });
            }

      - name: Close generation-canary incident after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] Omnia production generation canary failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues) {
              if (issue.title !== title || issue.pull_request) continue;
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered in run ${runUrl}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Report generation canary to Telegram
        if: always()
        env:
          PRODUCTION_CANARY_RESULT_FILE: ${{ runner.temp }}/production-canary-result.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 infra/monitoring/telegram_generation_report.py
