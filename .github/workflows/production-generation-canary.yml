name: Production generation canary

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      report_incident:
        description: Allow this manual run to open or close monitor issues
        type: boolean
        default: false
      catalog_acceptance:
        description: Run one disposable catalog build with browser and owner edits
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: production-generation-canary
  cancel-in-progress: false

jobs:
  authorize-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Reject production canary outside main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Production generation canary runs only from refs/heads/main"
          exit 1

  canary:
    needs: authorize-ref
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_GENERATION_CANARY_ENABLED == 'true'
    # The frozen Playwright 1.60 browser supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Verify protected canary configuration
        shell: bash
        env:
          PRODUCTION_CANARY_EMAIL: ${{ secrets.PRODUCTION_CANARY_EMAIL }}
          PRODUCTION_CANARY_PASSWORD: ${{ secrets.PRODUCTION_CANARY_PASSWORD }}
          PRODUCTION_EXPECTED_WEB_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_WEB_RELEASE_SHA }}
          PRODUCTION_EXPECTED_API_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_API_RELEASE_SHA }}
          PRODUCTION_EXPECTED_WORKER_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_WORKER_RELEASE_SHA }}
          PRODUCTION_EXPECTED_ORCHESTRATOR_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_ORCHESTRATOR_RELEASE_SHA }}
        run: |
          set -euo pipefail
          for name in \
            PRODUCTION_CANARY_EMAIL \
            PRODUCTION_CANARY_PASSWORD \
            PRODUCTION_EXPECTED_WEB_RELEASE_SHA \
            PRODUCTION_EXPECTED_API_RELEASE_SHA \
            PRODUCTION_EXPECTED_WORKER_RELEASE_SHA \
            PRODUCTION_EXPECTED_ORCHESTRATOR_RELEASE_SHA; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured"
              exit 1
            fi
          done

      - name: Install the locked API environment
        working-directory: apps/api
        run: uv sync --frozen

      - name: Install browser for manual catalog acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.catalog_acceptance
        working-directory: apps/api
        run: uv run --frozen playwright install --with-deps chromium

      - name: Run disposable build, preview, and edit canary
        working-directory: apps/api
        shell: bash
        env:
          CATALOG_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.catalog_acceptance }}
          PRODUCTION_CANARY_BASE_URL: https://yleum.ru
          PRODUCTION_CANARY_PREVIEW_HOST_SUFFIXES: .dev.yleum.ru,.dev2.yleum.ru
          PRODUCTION_CANARY_EMAIL: ${{ secrets.PRODUCTION_CANARY_EMAIL }}
          PRODUCTION_CANARY_PASSWORD: ${{ secrets.PRODUCTION_CANARY_PASSWORD }}
          PRODUCTION_EXPECTED_WEB_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_WEB_RELEASE_SHA }}
          PRODUCTION_EXPECTED_API_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_API_RELEASE_SHA }}
          PRODUCTION_EXPECTED_WORKER_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_WORKER_RELEASE_SHA }}
          PRODUCTION_EXPECTED_ORCHESTRATOR_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_ORCHESTRATOR_RELEASE_SHA }}
          PRODUCTION_EXPECTED_GENERATION_WORKER_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_GENERATION_WORKER_RELEASE_SHA }}
          PRODUCTION_CANARY_RESULT_FILE: ${{ runner.temp }}/production-canary-result.json
          PRODUCTION_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/production-catalog-evidence
        run: |
          set -euo pipefail
          if [[ "${CATALOG_ACCEPTANCE}" == "true" ]]; then
            uv run --frozen python scripts/production_catalog_canary.py
          else
            uv run --frozen python scripts/production_generation_canary.py
          fi

      # The red runs are the ones whose diagnostics matter, so the result is
      # uploaded on failure too, and a missing result is its own failure
      # rather than a silent pass.
      - name: Upload canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-canary-result
          path: ${{ runner.temp }}/production-canary-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload manual catalog acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.catalog_acceptance
        uses: actions/upload-artifact@v4
        with:
          name: production-catalog-evidence
          path: |
            ${{ runner.temp }}/production-catalog-evidence/evidence.json
            ${{ runner.temp }}/production-catalog-evidence/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Open one generation-canary incident
        if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report_incident))
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] Omnia production generation canary failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (!issues.some((issue) => issue.title === title && !issue.pull_request)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "The disposable production build/edit canary failed.",
                  "",
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  "",
                  "No request payloads, cookies, signed preview URLs, or response bodies are included in this issue.",
                ].join("\n"),
              });
            }

      - name: Close generation-canary incident after recovery
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report_incident))
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] Omnia production generation canary failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues) {
              if (issue.title !== title || issue.pull_request) continue;
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered in run ${runUrl}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
