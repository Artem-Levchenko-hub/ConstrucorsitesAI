name: Production smoke

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "apps/api/src/omnia_api/ops/production_smoke.py"
      - "apps/api/tests/test_production_smoke.py"
  workflow_dispatch:
    inputs:
      release_sha:
        description: >-
          The exact revision this run is meant to certify. It must match the checked-out
          commit and the expected API revision; an older runner cannot certify a newer
          release. Leave empty to certify whatever main currently points at.
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

env:
  PLATFORM_URL: https://constructor.lead-generator.ru
  MAX_CANARY_URL: ${{ vars.PRODUCTION_MAX_CANARY_URL }}
  PRODUCTION_EXPECTED_WEB_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_WEB_RELEASE_SHA }}
  PRODUCTION_EXPECTED_API_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_API_RELEASE_SHA }}
  PRODUCTION_EXPECTED_WORKER_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_WORKER_RELEASE_SHA }}
  PRODUCTION_EXPECTED_ORCHESTRATOR_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_ORCHESTRATOR_RELEASE_SHA }}
  PRODUCTION_EXPECTED_GENERATION_WORKER_RELEASE_SHA: ${{ vars.PRODUCTION_EXPECTED_GENERATION_WORKER_RELEASE_SHA }}
  SMOKE_ARTIFACT_PATH: smoke.json
  # The revision this run certifies, declared explicitly rather than inherited.
  SMOKE_RUNNER_SHA: ${{ github.sha }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          # Ancestry needs history: a shallow clone cannot tell whether this
          # revision already contains the deployed one.
          fetch-depth: 0

      - name: Refuse a runner that cannot certify the requested release
        if: inputs.release_sha != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          requested="${{ inputs.release_sha }}"
          checked_out="$(git rev-parse HEAD)"
          if [ "${requested}" != "${checked_out}" ]; then
            echo "runner.checkout_mismatch requested=${requested} checked_out=${checked_out}"
            exit 1
          fi

      - name: State whether this revision already contains the deployed release
        shell: bash
        run: |
          set -Eeuo pipefail
          deployed="${PRODUCTION_EXPECTED_API_RELEASE_SHA}"
          contains=false
          # An older runner judges a newer release by criteria that predate it,
          # so it is refused. A runner that already contains the deployed commit
          # knows everything about it and may certify it.
          if [ -n "${deployed}" ] && git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "${deployed}" HEAD 2>/dev/null; then
              contains=true
            fi
          fi
          echo "SMOKE_RUNNER_CONTAINS_RELEASE=${contains}" >> "$GITHUB_ENV"
          echo "runner contains deployed release: ${contains}"

      - name: Probe platform and MAX canary
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=apps/api/src python3 -S -m omnia_api.ops.production_smoke

      - name: Open one incident issue
        if: github.event_name == 'schedule' && steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] Omnia production smoke failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (!issues.some((issue) => issue.title === title && !issue.pull_request)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "Off-host smoke detected a production failure.",
                  "",
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  "",
                  "The monitor checks exact web/API/worker/generation-worker/orchestrator release identity, Postgres, Redis, worker heartbeat, deploy control plane, preview storage, a deployed MAX canary, and the webhook auth boundary.",
                ].join("\n"),
              });
            }

      - name: Close incident after recovery
        if: github.event_name == 'schedule' && steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] Omnia production smoke failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues) {
              if (issue.title !== title || issue.pull_request) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Keep the smoke record whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Mark failed smoke red
        if: steps.smoke.outcome == 'failure'
        run: exit 1
