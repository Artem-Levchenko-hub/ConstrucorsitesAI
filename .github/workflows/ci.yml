name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Gateway tests
        working-directory: apps/llm-gateway
        run: uv run --frozen --extra dev pytest -q -p no:warnings

  api-release-gate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://omnia:omnia@127.0.0.1:5432/omnia_dev
      DATABASE_TEST_URL: postgresql+asyncpg://omnia:omnia@127.0.0.1:5432/omnia_test
      JWT_SECRET: ci-only-api-jwt-secret-at-least-32-bytes
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnia
          POSTGRES_PASSWORD: omnia
          POSTGRES_DB: omnia_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnia -d omnia_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Activate the pinned pnpm release
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Verify pnpm release
        run: test "$(pnpm --version)" = "9.15.0"
      - name: Install the locked API environment
        working-directory: apps/api
        run: uv sync --frozen
      - name: Lint and typecheck API
        working-directory: apps/api
        run: uv run ruff check . && uv run mypy src
      - name: Verify exact edits through both executors on disposable PostgreSQL
        working-directory: apps/api
        run: uv run --frozen pytest -o addopts='' -q tests/test_exact_edit_contract.py
      - name: Verify generation snapshot publication on disposable PostgreSQL
        working-directory: apps/api
        run: uv run --frozen pytest -o addopts='' -q tests/test_generation_artifacts.py
      - name: Verify cancellation transaction and consumers on disposable PostgreSQL
        working-directory: apps/api
        run: >-
          uv run --frozen pytest -o addopts='' -q
          tests/test_generation_cancellation.py
          tests/test_generation_runs.py::test_cancel_endpoint_terminalizes_queued_run_before_any_signal_or_finalizer
          tests/test_generation_worker.py::test_cancel_before_dispatch_never_executes
      - name: Run release-critical API regressions
        working-directory: apps/api
        run: >-
          uv run pytest -q
          tests/test_deploy_gate_defaults.py
          tests/test_release_identity.py
          tests/test_readiness.py
          tests/test_auth.py
          tests/test_agent_native.py
          tests/test_generation_runs.py
          tests/test_generation_worker.py
          tests/test_app_integrations_api.py
          tests/test_platform_ai.py
          tests/test_runtime_ai_gateway.py
          tests/test_aitunnel_integration.py
          tests/test_integration_credentials.py
          tests/test_integration_runtime_contracts.py
          tests/test_integration_runtime_auth.py
          tests/test_integration_catalog_contracts.py
          tests/test_integration_iiko_responses.py
          tests/test_projects_delete.py
          tests/test_project_memory.py
          tests/test_production_canary.py
          tests/test_generation_telegram_removal_migration.py
          tests/test_migrations_single_head.py
          tests/test_telegram_reporting_removed.py
          tests/test_orchestrator_client.py
          tests/test_project_cell_lifecycle.py
          tests/test_project_cell_runtime_api.py
          tests/test_project_cell_wire_contract.py
          tests/test_messages_project_cell.py
          tests/test_max_generation_contract.py
          tests/test_max_managed_generation.py
          tests/test_max_runtime_probe.py
          tests/test_max_finalization.py
          tests/test_max_finalization_integration.py
          tests/test_project_versions.py
          tests/test_snapshot_preview_capture.py
          tests/test_snapshot_preview_images.py
          tests/test_preview_live_capture.py
          tests/test_snapshot_restore.py
          tests/test_rollback_container_hot_reload.py
      - name: Run MAX portable starter contract
        working-directory: apps/api
        run: >-
          uv run pytest -q
          tests/test_max_project_kit.py
      - name: Run static template materialization and consumer contracts
        working-directory: apps/api
        run: >-
          uv run --frozen pytest -q
          tests/test_template_materialization.py
          tests/test_select_mode.py
          tests/test_project_export.py
          tests/test_repo_import.py
          tests/test_template_registration.py
          tests/test_template_mapping.py
      - name: Verify templates from an installed wheel outside the checkout
        working-directory: apps/api
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/omnia-task5-wheel"
          uv pip install --python .venv/bin/python --no-deps \
            --target "$RUNNER_TEMP/omnia-task5-installed" "$RUNNER_TEMP/omnia-task5-wheel/"*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/omnia-task5-installed" \
            "$GITHUB_WORKSPACE/apps/api/.venv/bin/python" \
            "$GITHUB_WORKSPACE/apps/api/scripts/verify_template_package.py" \
            "$GITHUB_WORKSPACE/apps/api/tests/fixtures/static_templates_810f0fbb.json" \
            --package-root "$RUNNER_TEMP/omnia-task5-installed"
      - name: Run complete API regression suite on disposable services
        working-directory: apps/api
        run: uv run --frozen pytest -o addopts='' -q --durations=10

  orchestrator-release-gate:
    runs-on: ubuntu-latest
    env:
      RESTORATION_TEST_DATABASE_URL: postgresql://postgres:ci-restoration-only@127.0.0.1:5432/restoration_policy_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-restoration-only
          POSTGRES_DB: restoration_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restoration_policy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install the locked orchestrator environment
        working-directory: apps/orchestrator
        run: uv sync --frozen
      - name: Lint and typecheck orchestrator
        working-directory: apps/orchestrator
        run: >-
          uv run ruff check
          src/omnia_orchestrator/core/release.py
          src/omnia_orchestrator/routers/health.py
          tests/test_health.py
          && uv run mypy src
      - name: Run orchestrator tests
        working-directory: apps/orchestrator
        run: uv run pytest -q
      - name: Run isolated P01 PostgreSQL volume probe
        working-directory: apps/orchestrator
        env:
          OMNIA_P01_LIVE_DOCKER: "1"
          OMNIA_P01_HELPER_IMAGE: >-
            alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        run: |
          docker pull "$OMNIA_P01_HELPER_IMAGE"
          uv run pytest -q -s tests/test_live_postgres_volume_probe.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Activate the pinned pnpm release
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Verify pnpm release
        run: test "$(pnpm --version)" = "9.15.0"
      - name: Install web dependencies reproducibly
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Assert install did not rewrite manifests or lockfiles
        run: git diff --exit-code -- apps/web/package.json apps/web/pnpm-lock.yaml apps/web/pnpm-workspace.yaml
      - name: Typecheck, test, and build web
        working-directory: apps/web
        run: pnpm typecheck && pnpm test && pnpm build

  py-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile API and orchestrator sources
        run: python -m compileall -q apps/api/src apps/orchestrator/src

  image-build:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret
      SECRETS_ENCRYPTION_KEY: ci-only-encryption-key
      ORCHESTRATOR_INTERNAL_TOKEN: ci-only-orchestrator-token
      NEXTAUTH_SECRET: ci-only-nextauth-secret
      OMNIA_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify rendered production policy
        run: bash infra/release/test-compose-policy.sh
      - name: Build production API and web images
        run: docker compose -f apps/llm-gateway/deploy/full/docker-compose.yml build api web
      - name: Verify packaged API templates without source mounts or network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 128 --memory 512m \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m --workdir /tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/apps/api/scripts/verify_template_package.py,dst=/smoke/verify.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/apps/api/tests/fixtures/static_templates_810f0fbb.json,dst=/smoke/golden.json,readonly" \
            --entrypoint /app/.venv/bin/python omnia-api:prod \
            /smoke/verify.py /smoke/golden.json --package-root /app/src

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint
