{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "omnia-project-cell-system",
        "labels": {
          "pod-security.kubernetes.io/enforce": "restricted",
          "pod-security.kubernetes.io/enforce-version": "v1.36",
          "pod-security.kubernetes.io/audit": "restricted",
          "pod-security.kubernetes.io/warn": "restricted"
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "trusted-hello",
        "namespace": "omnia-project-cell-system",
        "labels": {"app.kubernetes.io/name": "trusted-hello"}
      },
      "spec": {
        "replicas": 1,
        "selector": {"matchLabels": {"app.kubernetes.io/name": "trusted-hello"}},
        "template": {
          "metadata": {"labels": {"app.kubernetes.io/name": "trusted-hello"}},
          "spec": {
            "automountServiceAccountToken": false,
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "runAsGroup": 65532,
              "seccompProfile": {"type": "RuntimeDefault"}
            },
            "containers": [
              {
                "name": "trusted-hello",
                "image": "registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85",
                "imagePullPolicy": "IfNotPresent",
                "args": ["netexec", "--http-port=8080"],
                "ports": [{"name": "http", "containerPort": 8080, "protocol": "TCP"}],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "privileged": false,
                  "readOnlyRootFilesystem": true,
                  "runAsNonRoot": true,
                  "capabilities": {"drop": ["ALL"]}
                },
                "resources": {
                  "requests": {"cpu": "10m", "memory": "16Mi", "ephemeral-storage": "16Mi"},
                  "limits": {"cpu": "100m", "memory": "64Mi", "ephemeral-storage": "64Mi"}
                },
                "readinessProbe": {
                  "httpGet": {"path": "/healthz", "port": "http"},
                  "initialDelaySeconds": 1,
                  "periodSeconds": 2,
                  "timeoutSeconds": 1,
                  "failureThreshold": 15
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "trusted-hello",
        "namespace": "omnia-project-cell-system"
      },
      "spec": {
        "type": "ClusterIP",
        "selector": {"app.kubernetes.io/name": "trusted-hello"},
        "ports": [{"name": "http", "port": 8080, "targetPort": "http", "protocol": "TCP"}]
      }
    }
  ]
}
