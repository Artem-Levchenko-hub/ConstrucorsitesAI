[project]
name = "yleum-recovery"
version = "0.1.0"
description = "Standalone portable recovery metadata contracts and verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.4",
    "cryptography==50.0.0",
    "httpx==0.28.1",
]

[project.scripts]
yleum = "yleum_recovery.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.14", "mypy==1.20.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yleum_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
