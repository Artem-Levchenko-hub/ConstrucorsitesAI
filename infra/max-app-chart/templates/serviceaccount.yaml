{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "max-app.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "max-app.labels" . | nindent 4 }}
  {{- with merge (dict) (.Values.serviceAccount.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload in this chart talks to the Kubernetes API. Mounting a token would
# only widen what a compromised generated app can reach.
automountServiceAccountToken: false
{{- end }}
