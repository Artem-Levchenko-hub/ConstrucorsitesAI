{{- if not .Values.secrets.existingSecret }}
{{- $values := .Values.secrets.values | default dict }}
{{- if not $values.postgresPassword }}
{{- fail "max-app: secrets.values.postgresPassword is required unless secrets.existingSecret is set" }}
{{- end }}
{{- if and .Values.core.enabled (not $values.authSecret) }}
{{- fail "max-app: secrets.values.authSecret is required when core.enabled is true (the trusted core signs the MAX session cookie with it)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "max-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "max-app.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
# stringData, never data: the values stay readable in `helm get manifest` but
# they are still stored as a Secret. Nothing below is ever copied into a
# ConfigMap, an annotation or a container argument.
stringData:
  {{ .Values.secrets.keys.postgresPassword }}: {{ $values.postgresPassword | quote }}
  # The product reaches its own database. Password is percent-encoded so a
  # generated password with URL metacharacters still produces a valid DSN.
  {{ .Values.secrets.keys.databaseUrl }}: {{ include "max-app.postgresDsn" (dict "context" . "database" .Values.postgres.database "password" $values.postgresPassword) | quote }}
  {{- if .Values.core.enabled }}
  # The trusted core keeps MAX identity, consent and webhook tables apart from
  # the product's own data. In the Docker runtime this is a physically separate
  # PostgreSQL instance; see README "What is NOT covered yet".
  {{ .Values.secrets.keys.coreDatabaseUrl }}: {{ include "max-app.postgresDsn" (dict "context" . "database" .Values.postgres.coreDatabase "password" $values.postgresPassword) | quote }}
  {{ .Values.secrets.keys.authSecret }}: {{ $values.authSecret | quote }}
  {{- with $values.maxBotToken }}
  {{ $.Values.secrets.keys.maxBotToken }}: {{ . | quote }}
  {{- end }}
  {{- with $values.maxWebhookSecret }}
  {{ $.Values.secrets.keys.maxWebhookSecret }}: {{ . | quote }}
  {{- end }}
  {{- with $values.redisUrl }}
  {{ $.Values.secrets.keys.redisUrl }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
