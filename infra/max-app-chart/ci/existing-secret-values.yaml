# CI values: referenced-Secret mode.
#
# No credential appears in this file at all. The chart renders no Secret and
# every container reads its credentials from a Secret created out of band,
# under key names this file chooses — which is how the orchestrator will use it
# (it already owns the credential files and must not hand plaintext to Helm).
#
# This file also exercises the egress allow-list, the PodDisruptionBudget and
# the "route the Ingress straight at the product" escape hatch.

projectId: "00000000-0000-4000-8000-000000000001"
publicOrigin: "https://second.example.test"

app:
  image:
    repository: registry.k8s.io/e2e-test-images/agnhost
    digest: sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
  healthPath: /healthz
  args:
    - netexec
    - "--http-port=3000"
  runAsUser: 65532
  runAsGroup: 65532
  replicaCount: 2

core:
  image:
    repository: registry.k8s.io/e2e-test-images/agnhost
    digest: sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
  healthPath: /healthz
  args:
    - netexec
    - "--http-port=3000"
  runAsUser: 65532
  runAsGroup: 65532
  platformApiUrl: "https://platform.example.test"

postgres:
  image:
    repository: postgres
    digest: sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
  persistence:
    size: 2Gi
    storageClassName: fast-ssd

secrets:
  existingSecret: max-app-external-credentials
  keys:
    postgresPassword: pg-password
    databaseUrl: app-dsn
    coreDatabaseUrl: core-dsn
    authSecret: session-key
    maxBotToken: bot-token
    maxWebhookSecret: webhook-secret
    redisUrl: redis-dsn

ingress:
  enabled: true
  className: nginx
  host: second.example.test
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
  tls:
    enabled: true
    secretName: max-app-example-wildcard-tls
  # Straight at the product: the MAX authentication boundary is not packaged,
  # so this has to be acknowledged explicitly.
  service: app
  acknowledgeMissingAuthBoundary: true

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      app.kubernetes.io/name: ingress-nginx
  egressAllowlist:
    - name: max-bot-api
      component: core
      cidrs:
        - 203.0.113.0/24
      ports:
        - port: 443
          protocol: TCP
    - name: omnia-platform-api
      component: core
      cidrs:
        - 198.51.100.7/32
      ports:
        - port: 443
          protocol: TCP

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

commonLabels:
  omnia.io/tenant: example
commonAnnotations:
  omnia.io/managed-by: orchestrator
