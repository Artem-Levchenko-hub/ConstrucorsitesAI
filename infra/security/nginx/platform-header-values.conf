# Only referenced by the platform vhost. HTTP redirects emit no HSTS/nosniff.
# Keep transport policy host-only: generated apps/previews own their hosts.
map $scheme $yleum_platform_hsts {
    default "";
    https "max-age=31536000";
}
map $scheme $yleum_platform_nosniff {
    default "";
    https "nosniff";
}
