# Include in platform server blocks AND locations with their own add_header.
# Framing belongs to each upstream: Studio, MAX boundary and MoySklad differ.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
add_header Strict-Transport-Security $yleum_platform_hsts always;
add_header X-Content-Type-Options $yleum_platform_nosniff always;
